# Render Blueprint: one web service with a persistent disk for the SQLite database.
# In Render: New → Blueprint → pick this repo. Fill in ADMIN_EMAILS when asked.
services:
  - type: web
    name: hospitality-crm
    runtime: node
    plan: starter            # a persistent disk needs a paid plan
    region: ohio
    buildCommand: "true"     # no dependencies to install
    startCommand: node server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: SECURE_COOKIE
        value: "1"
      - key: ADMIN_EMAILS
        sync: false          # comma-separated; these emails become admins when they sign up
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
